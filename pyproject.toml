[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "goldenswing"
version = "0.1.0"
description = "GoldenSwing — an aware market-reading system that identifies big, backed swing moves (Golden Swings) in XAUUSD."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "yfinance>=0.2",
    "matplotlib>=3.6",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
forecast = ["scikit-learn>=1.3"]

[project.scripts]
goldenswing-backtest = "goldenswing.backtest.harness:main"

[tool.setuptools.packages.find]
include = ["goldenswing*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
